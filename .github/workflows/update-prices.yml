name: Update TCL prices

# Refreshes prices/data from bestbuy.com about every hour. GitHub Pages publishes
# from `main`, so each data commit republishes the site. Scheduled runs use this
# file from the repository's default branch, so it always checks out and updates
# `main`.

on:
  schedule:
    # Hourly: GitHub skips many scheduled runs when it's busy, so an hourly
    # schedule is what reliably refreshes prices every few hours.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tracker/**', 'prices/*.html', 'prices/*.js', 'prices/*.css', '.github/workflows/update-prices.yml']

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      - name: Fetch prices from bestbuy.com
        run: npm run fetch

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../prices/data
          if ! git diff --cached --quiet; then
            git commit -m "Update prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
