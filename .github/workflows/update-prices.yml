name: Update prices (TCL & Sony)

# Refreshes prices/data (TCL) and sony/data (Sony) from bestbuy.com every 3 hours
# and republishes the site.
# Scheduled runs use this file from the repository's default branch, so it always
# checks out and updates `main`, the branch GitHub Pages publishes.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tracker/**', 'prices/*.html', 'prices/*.js', 'prices/*.css', 'sony/*.html', '.github/workflows/update-prices.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      # Each brand is fetched separately, so one failing doesn't lose the other's
      # prices. A failure still fails the run (last step).
      - name: Fetch TCL prices from bestbuy.com
        id: tcl
        continue-on-error: true
        run: npm run fetch

      - name: Fetch Sony prices from bestbuy.com
        id: sony
        continue-on-error: true
        run: npm run fetch:sony

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../prices/data ../sony/data
          if ! git diff --cached --quiet; then
            git commit -m "Update prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail if a brand's fetch failed
        if: steps.tcl.outcome == 'failure' || steps.sony.outcome == 'failure'
        run: |
          echo "::error::Price fetch failed for: ${{ steps.tcl.outcome == 'failure' && 'TCL ' || '' }}${{ steps.sony.outcome == 'failure' && 'Sony' || '' }}. The other brand's prices were still saved."
          exit 1

  # Publish the updated site. A push made by this workflow doesn't start other
  # workflows, so deploy here rather than relying on deploy.yml.
  deploy:
    needs: update
    # Publish even if one brand's fetch failed; the other brand's prices are new.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages isn't set up for GitHub Actions deploys, so this run didn't publish. If Pages deploys from the main branch instead, the data commit publishes it."
