name: Sony probe (temporary)
on:
  push:
    branches: [claude/sony-home-theater-maf681]
    paths: ['tracker/**', '.github/workflows/sony-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm run fetch:sony
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../sony/data && git commit -m "Sony probe data" && git push
